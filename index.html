<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Web App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List</h1>
        <p class="subtitle">Stay Organized & Productive</p>

        <!-- Input Section -->
        <div class="input-section">

            <input
                type="text"
                id="task-input"
                placeholder="Enter your task">

            <div class="datetime">

                <input
                    type="date"
                    id="task-date">

                <input
                    type="time"
                    id="task-time">

            </div>

            <button id="add-btn">
                + Add Task
            </button>

        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-box">
                <h3 id="total-task">0</h3>
                <p>Total</p>
            </div>

            <div class="stat-box">
                <h3 id="completed-task">0</h3>
                <p>Completed</p>
            </div>

            <div class="stat-box">
                <h3 id="pending-task">0</h3>
                <p>Pending</p>
            </div>

        </div>

        <!-- Task List -->
        <div id="task-list">

            <!-- Tasks will be added using JavaScript -->

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
